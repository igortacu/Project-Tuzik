services:
  murzik:
    build: .
    container_name: murzik_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OBSIDIAN_VAULT_PATH=/vault
      - TZ=Europe/Chisinau
    volumes:
      - ./data:/app/data
      - vault:/vault
    depends_on:
      - syncthing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: murzik_syncthing
    restart: unless-stopped
    hostname: murzik-vps
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing-config:/var/syncthing
      - vault:/var/syncthing/vault
    ports:
      - "127.0.0.1:8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vault:
  syncthing-config:
